<!DOCTYPE html>

<html>
    <link href="catalogo.css" type="text/css" rel="stylesheet">
    <script type="text/javascript" src="tienda.js"></script>

    <head>
       
    </head>
        <body class="grid-container" onload="mostrarCatalogo()">
        <header class="item1">
            Catalogo de Productos
        </header>
        <nav class="item2">
            <a href="productos.html">Catálogo</a>
            <a href="productos.html">Productos</a>
        </nav>
        <aside class="item3">
            <form name="filtros" id="filter">   
            <fieldset>
                <legend>Buscador</legend>
                <label for=""search">Buscar</label>
                <input type="text" name="search" id="search" placeholder="Busca algo">
            </fieldset>
            <fieldset>
                <legend>Precios</legend>
                <p>
                    <label for="price-min">Mínimo</label>
                    <input type="number" name="price-min" id="price-min" placeholder="Precio mínimo">
                </p>
                <p>
                    <label for="price-max">Máximo</label>
                    <input type="number" name="price-max" id="price-max" placeholder="Precio máximo">
                </p>
            </fieldset>
            <fieldset>
                <legend>Tipo de Productos</legend>
                <p>
                    <input type="checkbox" name="tipo" id="protectores" value="protectores">
                    <label for="protectores">Protectores</label>
                    <input type="checkbox" name="tipo" id="entrenamiento" value="entrenamiento">
                    <label for="entrenamiento">Entrenamiento</label>
                    <input type="checkbox" name="tipo" id="dobok" value="dobox">
                    <label for="dobok">Dobok</label>
                </p>
            </fieldset>
            </form>
        </aside>
        
                <dialog id="modal">
                    <h2>Cabezal Cerrado</h2>
                    <p> Cabezal que hace cosas muy cosas</p>
                    <button type="button" onclick="cerrarModal()">Cerrar Modal</button>
                </dialog>
            <main id="catalogo" class="item4">
                
            </main>

            <footer class="item5">
                Contacto
            </footer>
        </body>

</html>
